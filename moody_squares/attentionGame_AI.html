<!DOCTYPE html>
<html>
<head>
    <title>Moody Squares Game</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
        }

        table {
            border-spacing: 8px;
            margin: auto;
        }

        .square {
            width: 80px;
            height: 80px;
            background-color: lightgray;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        #scoreboard {
            font-size: 20px;
            margin: 15px;
        }

        #result-list {
            margin-top: 20px;
            font-size: 18px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<h2>Moody Squares Attention Game</h2>

<div>
    🎯 Choose your target color:
    <select id="colorSelector">
        <option value="magenta">Magenta</option>
        <option value="violet">Violet</option>
        <option value="lime">Lime</option>
        <option value="orange">Orange</option>
        <option value="turquoise">Turquoise</option>
    </select>
    <button onclick="startGame()">Start Game</button>
</div>

<div id="scoreboard" class="hidden">
    Time left: <span id="time">60</span>s |
    Score: <span id="score">0</span>
</div>

<table id="grid" class="hidden"></table>

<div id="result-list"></div>

<script>
    const gridSize = 5;
    const maxTargetColor = 3;
    const similarColors = ["violet", "magenta", "lime", "orange", "turquoise", "blue", "green", "yellow"];
    let score = 0;
    let timeLeft = 60;
    let targetColor = "magenta";
    let targetCells = new Set();
    let blinkTimer = null;
    let countdownTimer = null;

    const grid = document.getElementById("grid");
    const scoreDisplay = document.getElementById("score");
    const timeDisplay = document.getElementById("time");
    const scoreboard = document.getElementById("scoreboard");
    const resultList = document.getElementById("result-list");

    function createGrid() {
        grid.innerHTML = "";
        for (let i = 0; i < gridSize; i++) {
            const row = document.createElement("tr");
            for (let j = 0; j < gridSize; j++) {
                const cell = document.createElement("td");
                const id = `cell-${i}-${j}`;
                cell.id = id;
                cell.className = "square";
                cell.onclick = () => handleClick(id);
                row.appendChild(cell);
            }
            grid.appendChild(row);
        }
    }

    function startGame() {
        targetColor = document.getElementById("colorSelector").value;
        score = 0;
        timeLeft = 60;
        scoreDisplay.textContent = score;
        timeDisplay.textContent = timeLeft;
        scoreboard.classList.remove("hidden");
        grid.classList.remove("hidden");
        resultList.innerHTML = "";
        targetCells.clear();
        createGrid();

        // Start countdown and blinking
        runCountdown();
        adjustBlinkingSpeed(); // calls blinking first time
    }

    function handleClick(id) {
        if (targetCells.has(id)) {
            score++;
            scoreDisplay.textContent = score;
            targetCells.delete(id);
            document.getElementById(id).style.backgroundColor = "lightgray";
        }
    }

    function blinkSquares() {
        const allCells = document.querySelectorAll(".square");
        targetCells.clear();

        const available = Array.from(allCells);
        const chosen = [];

        while (chosen.length < maxTargetColor && available.length > 0) {
            const rand = Math.floor(Math.random() * available.length);
            chosen.push(available[rand]);
            available.splice(rand, 1);
        }

        allCells.forEach(cell => {
            if (chosen.includes(cell)) {
                cell.style.backgroundColor = targetColor;
                targetCells.add(cell.id);
            } else {
                let color;
                do {
                    color = similarColors[Math.floor(Math.random() * similarColors.length)];
                } while (color === targetColor);
                cell.style.backgroundColor = color;
            }
        });
    }

    function adjustBlinkingSpeed() {
        const elapsed = 60 - timeLeft;
        const minInterval = 500;
        const maxInterval = 1100;

        let interval;
        if (timeLeft > 10) {
            const progress = elapsed / 50;
            interval = maxInterval - progress * (maxInterval - minInterval);
        } else {
            interval = minInterval;
        }

        clearInterval(blinkTimer);
        blinkSquares(); // do one immediately
        blinkTimer = setInterval(blinkSquares, interval);
    }

    function runCountdown() {
        countdownTimer = setInterval(() => {
            timeLeft--;
            timeDisplay.textContent = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            } else {
                adjustBlinkingSpeed();
            }
        }, 1000);
    }

    function endGame() {
        clearInterval(blinkTimer);
        clearInterval(countdownTimer);
        scoreboard.classList.add("hidden");
        grid.classList.add("hidden");

        const result = document.createElement("p");
        result.innerHTML = `⏱️ Time's up! You clicked <strong style="color:${targetColor}">${targetColor}</strong> squares <strong>${score}</strong> time(s).`;
        resultList.appendChild(result);
    }
</script>

</body>
</html>
